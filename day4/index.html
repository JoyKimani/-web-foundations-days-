<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f5ef" />
    <title>QuickNotes | Draft Pad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="index.html" aria-label="QuickNotes home">quicknotes<span>.</span></a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>

    <main>
      <section class="editor" aria-labelledby="page-title">
        <div class="editor-heading">
          <p class="eyebrow">A quiet place to think</p>
          <h1 id="page-title">Your draft</h1>
          <p class="intro">Get it down. You can tidy it up later.</p>
        </div>

        <label for="note-text">Note</label>
        <textarea id="note-text" placeholder="Start writing here..." aria-describedby="char-count word-count"></textarea>

        <div class="editor-footer">
          <div class="counts" aria-live="polite" aria-atomic="true">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
          </div>
          <button id="clear-btn" class="clear-button" type="button">Clear note</button>
        </div>
        <p class="save-status" aria-live="polite">Draft saved on this device</p>
      </section>
    </main>

    <footer>QuickNotes <span aria-hidden="true">/</span> Day 4</footer>
  </body>
</html>
