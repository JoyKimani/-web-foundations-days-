<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183d3a" />
    <title>People Index | Day 5</title>
    <script src="users.js" defer></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      :root {
        color-scheme: light;
        --page: #f3f5f0;
        --surface: #fff;
        --ink: #1c302d;
        --muted: #657772;
        --line: #dce5df;
        --forest: #183d3a;
        --forest-light: #27534c;
        --coral: #d66b50;
        --mint: #e7efea;
        --focus: #3f8e7b;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--page);
        color: var(--ink);
        font-family: "Trebuchet MS", sans-serif;
        line-height: 1.5;
      }

      button,
      input {
        font: inherit;
      }

      .site-header {
        color: #f7fbf8;
        background: var(--forest);
        background-image: linear-gradient(110deg, transparent 0 74%, rgb(255 255 255 / 4%) 74% 75%, transparent 75%);
      }

      .header-inner {
        width: min(100% - 40px, 980px);
        margin: auto;
        padding: 42px 0 38px;
      }

      .brand {
        color: #b8d2c5;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
      }

      h1 {
        margin-top: 7px;
        font-size: clamp(2.3rem, 5vw, 3.4rem);
        line-height: 1.08;
      }

      .tagline {
        margin-top: 10px;
        color: #d0dfd8;
        font-size: 0.95rem;
      }

      main {
        width: min(100% - 40px, 980px);
        margin: 30px auto 52px;
        flex: 1;
      }

      .directory-tools {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .section-label {
        color: var(--forest-light);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h2 {
        margin-top: 3px;
        font-size: 1.8rem;
      }

      .filter-control {
        width: min(100%, 320px);
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 44px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        color: var(--ink);
      }

      input::placeholder {
        color: #83918c;
      }

      input:focus-visible,
      button:focus-visible {
        border-color: var(--focus);
        outline: 3px solid rgb(63 142 123 / 25%);
        outline-offset: 2px;
      }

      button {
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 5px;
        background: var(--coral);
        color: #fff;
        cursor: pointer;
        font-size: 0.88rem;
        font-weight: 700;
        transition: background-color 150ms ease, transform 150ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        background: #bd573e;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 24px;
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      #users-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 0;
        list-style: none;
      }

      .user-card {
        min-width: 0;
        padding: 18px;
        border: 1px solid var(--line);
        border-top: 3px solid var(--forest-light);
        border-radius: 6px;
        background: var(--surface);
        box-shadow: 0 3px 12px rgb(28 48 45 / 4%);
      }

      .user-card h3 {
        overflow-wrap: anywhere;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.24rem;
        font-weight: 400;
      }

      .user-email {
        overflow-wrap: anywhere;
        margin-top: 3px;
        color: var(--forest-light);
        font-size: 0.82rem;
      }

      .user-details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 17px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      .detail-label {
        color: var(--muted);
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .detail-value {
        overflow-wrap: anywhere;
        margin-top: 3px;
        font-size: 0.82rem;
      }

      .empty-state {
        grid-column: 1 / -1;
        padding: 28px 16px;
        border: 1px dashed #bdcec5;
        border-radius: 6px;
        color: var(--muted);
        text-align: center;
      }

      footer {
        padding: 18px 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.74rem;
        text-align: center;
      }

      @media (max-width: 640px) {
        .header-inner,
        main {
          width: min(100% - 32px, 980px);
        }

        .header-inner {
          padding: 34px 0;
        }

        main {
          margin-top: 22px;
        }

        .directory-tools {
          align-items: stretch;
          flex-direction: column;
          gap: 15px;
        }

        .filter-control {
          width: 100%;
        }

        #users-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <p class="brand">QuickNotes / Web Foundations</p>
        <h1>People Index</h1>
        <p class="tagline">A small directory of names, places, and teams.</p>
      </div>
    </header>

    <main>
      <section aria-labelledby="directory-heading">
        <div class="directory-tools">
          <div>
            <p class="section-label">Directory</p>
            <h2 id="directory-heading">People</h2>
          </div>
          <button id="load-users" type="button">Load users</button>
          <div class="filter-control">
            <label for="filter-input">Filter by name</label>
            <input id="filter-input" type="search" placeholder="Type a name..." autocomplete="off" />
          </div>
        </div>
        <p id="status" role="status" aria-live="polite">Select “Load users” to fetch the directory.</p>
        <ul id="users-list" aria-live="polite" aria-busy="false"></ul>
      </section>
    </main>

    <footer>People Index <span aria-hidden="true">/</span> Day 5</footer>
  </body>
</html>
